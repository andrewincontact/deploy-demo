name: pipeline
on:
  pull_request:
  push:
    branches: [main]
env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: andrewincontact/deploy-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload JAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-demo-jar
          path: target/*.jar
          retention-days: 7