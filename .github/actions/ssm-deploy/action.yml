name: ssm-deploy
description: Send deploy files to the EC2 instance via SSM, run deploy.sh and wait for the result

inputs:
  instance-id:
    description: EC2 instance ID
    required: true
  tag:
    description: Image tag to deploy (hex commit SHA, 7-40 characters)
    required: true
  timeout-seconds:
    description: Maximum run time of deploy.sh on the instance (also bounds the wait in this step)
    required: false
    default: "600"

runs:
  using: composite
  steps:
    - name: Send command and wait
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-id }}
        TAG: ${{ inputs.tag }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
        APP_DIR: /opt/deploy-demo
      run: |
        set -euo pipefail

        if [[ ! "$TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
          echo "Refusing to deploy: invalid tag '$TAG'" >&2
          exit 2
        fi
        if [[ ! "$TIMEOUT" =~ ^[1-9][0-9]{0,4}$ ]] || (( TIMEOUT > 28800 )); then
          echo "Refusing to deploy: invalid timeout-seconds '$TIMEOUT'" >&2
          exit 2
        fi

        PARAMS="$RUNNER_TEMP/ssm-params.json"

        # --rawfile makes jq fail if a file is missing, so we never ship an empty file.
        # Files travel base64-encoded, so their content cannot break the command.
        jq -n \
          --arg dir "$APP_DIR" \
          --arg tag "$TAG" \
          --arg timeout "$TIMEOUT" \
          --rawfile compose deploy/compose.yaml \
          --rawfile script deploy/deploy.sh \
          '{
             executionTimeout: [$timeout],
             commands: [
               "set -e",
               "mkdir -p \($dir)",
               "echo \($compose | @base64) | base64 -d > \($dir)/compose.yaml",
               "echo \($script | @base64) | base64 -d > \($dir)/deploy.sh",
               "chmod +x \($dir)/deploy.sh",
               "\($dir)/deploy.sh \($tag)"
             ]
           }' > "$PARAMS"

        CMD_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "deploy $TAG" \
          --parameters "file://$PARAMS" \
          --query Command.CommandId --output text)
        echo "SSM command id: $CMD_ID"

        # Wait for the remote timeout plus a minute for delivery and agent start-up
        DEADLINE=$(( SECONDS + TIMEOUT + 60 ))
        STATUS=Pending
        while (( SECONDS < DEADLINE )); do
          if ! OUT=$(aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --query Status --output text 2>&1); then
            # Right after send-command the invocation may not exist yet; anything else is a real error
            grep -q InvocationDoesNotExist <<<"$OUT" || { echo "$OUT" >&2; exit 1; }
            OUT=Pending
          fi
          STATUS=$OUT
          case "$STATUS" in
            Success|Failed|Cancelled|TimedOut) break ;;
          esac
          sleep 5
        done

        echo "--- output ---"
        aws ssm get-command-invocation --command-id "$CMD_ID" \
          --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text \
          || echo "(could not fetch output)"
        echo "--- errors ---"
        aws ssm get-command-invocation --command-id "$CMD_ID" \
          --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text \
          || echo "(could not fetch errors)"
        echo "Final status: $STATUS"

        case "$STATUS" in
          Success|Failed|Cancelled|TimedOut) ;;
          *) echo "Stopped waiting; the command may still be running on the instance (id: $CMD_ID)" >&2 ;;
        esac
        
        echo "### Deploy \`$TAG\`: $STATUS" >> "$GITHUB_STEP_SUMMARY"

        test "$STATUS" = "Success"